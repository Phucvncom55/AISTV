# AI STV - Windows Environment Integration Test
# ------------------------------------------------------------------
# Secrets cần cấu hình trên Repository (Settings > Secrets and variables > Actions):
#   TAILSCALE_AUTHKEY  : Tailscale pre-authenticated key (REUSABLE), gắn sẵn tag:vm-user
#   TELEGRAM_BOT_TOKEN : Token của bot Telegram dùng để gửi DM riêng tư
#   TELEGRAM_CHAT_ID   : (tuỳ chọn) chat ID mặc định khi bấm "Run workflow" tay
# GH_PAT không cần trong workflow này - nó do hệ thống bot/Telegram quản lý riêng.
#
# Người nhận DM: input `telegram_chat_id` (bot truyền vào mỗi lần tạo máy) → đúng
# người yêu cầu kể cả khi nhiều người tạo máy cùng lúc; nếu trống thì dùng secret.
#
# LƯU Ý ENCODING: các bước dùng `shell: powershell` (Windows PowerShell 5.1) phải là
# ASCII thuần. Runner ghi script ra file .ps1 UTF-8 không BOM; PowerShell 5.1 đọc theo
# ANSI/CP1252 nên chữ Việt bị vỡ dấu và có thể biến thành dấu nháy cong -> lỗi cú pháp.
# Riêng bước gửi Telegram dùng `shell: pwsh` (PowerShell 7, đọc UTF-8) để giữ tiếng Việt.
# ------------------------------------------------------------------

name: Windows Environment Integration Test

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Chọn phiên bản Windows runner'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-2022
          - windows-2025
      timeout_minutes:
        description: 'Thời gian chạy test (phút), tối thiểu 60 - tối đa 360'
        required: true
        default: 360
        type: number
      telegram_chat_id:
        description: 'Chat ID nhận thông tin đăng nhập (bot truyền vào; trống = dùng secret)'
        required: false
        default: ''
        type: string
      requested_by:
        description: 'Tên người yêu cầu (hiển thị trong tin nhắn DM)'
        required: false
        default: ''
        type: string

jobs:
  integration-test:
    name: Integration Test
    runs-on: ${{ github.event.inputs.windows_version || 'windows-latest' }}
    timeout-minutes: 360

    env:
      # Cho phép tùy chỉnh thời gian chạy qua biến môi trường (fallback khi không dùng workflow_dispatch)
      TIMEOUT_MINUTES: ${{ github.event.inputs.timeout_minutes || 360 }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Người nhận DM của lần chạy này: input do bot truyền, fallback về secret
      TG_TARGET: ${{ github.event.inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
      REQ_BY: ${{ github.event.inputs.requested_by }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAILSCALE_AUTHKEY) {
            throw 'TAILSCALE_AUTHKEY is missing. Add it in Settings > Secrets and variables > Actions (value starts with tskey-).'
          }
          if (-not $env:TELEGRAM_BOT_TOKEN -or -not $env:TG_TARGET) {
            Write-Host 'WARNING: Telegram recipient/token not set - login details will NOT be delivered.'
          }
          Write-Host 'Secrets OK.'

      - name: Configure System User & RDP Access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Username = 'trongphuc'

          # 36-char random password (Base64 of 27 bytes) with all character classes
          $RandomBytes = New-Object Byte[] 27
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($RandomBytes)
          $PasswordStr = [Convert]::ToBase64String($RandomBytes)
          if ($PasswordStr -notmatch '[A-Z]') { $PasswordStr += 'A' }
          if ($PasswordStr -notmatch '[a-z]') { $PasswordStr += 'a' }
          if ($PasswordStr -notmatch '[0-9]') { $PasswordStr += '1' }
          if ($PasswordStr -notmatch '[^A-Za-z0-9]') { $PasswordStr += '!' }

          $Password = ConvertTo-SecureString $PasswordStr -AsPlainText -Force

          if (Get-LocalUser -Name $Username -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $Username -Password $Password
          } else {
            New-LocalUser -Name $Username -Password $Password -FullName 'AI STV Test Runner' `
              -Description 'Automated Integration Test Service' -AccountNeverExpires
          }

          # Administrator + Remote Desktop Users
          Add-LocalGroupMember -Group 'Administrators' -Member $Username
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $Username

          # Enable RDP and open firewall for connections over the Tailscale mesh
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          # Optional hardening: allow RDP only from the Tailscale range
          # Get-NetFirewallRule -DisplayGroup 'Remote Desktop' | Set-NetFirewallRule -RemoteAddress '100.64.0.0/10'

          # Mask the password - never print it in clear text on public logs
          Write-Output "::add-mask::$PasswordStr"

          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VM_USER=$Username`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VM_PASS=$PasswordStr`n")

      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAILSCALE_AUTHKEY) {
            throw 'TAILSCALE_AUTHKEY is missing (Repository Secret). Aborting.'
          }

          # Mask the auth key in public logs
          Write-Output "::add-mask::$env:TAILSCALE_AUTHKEY"

          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -UseBasicParsing -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile "$env:TEMP\tailscale-setup.exe"

          Write-Host 'Installing Tailscale...'
          Start-Process -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList '/quiet' -Wait
          Start-Sleep -Seconds 5
          $env:Path += ';C:\Program Files\Tailscale'

          $tsHostname = 'stv-' + $env:COMPUTERNAME
          Write-Host "Connecting to Tailnet (hostname: $tsHostname, tag:vm-user)..."
          # Auth key should be a reusable pre-authenticated key tagged tag:vm-user;
          # --advertise-tags is a fallback in case the key has no tag yet.
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey=$env:TAILSCALE_AUTHKEY --hostname=$tsHostname --accept-routes --advertise-tags=tag:vm-user --timeout=30s
          if ($LASTEXITCODE -ne 0) { throw 'tailscale up failed' }

          # Get the Tailscale IP (retry for up to 60 seconds)
          $tsIp = $null
          for ($i = 0; $i -lt 12; $i++) {
            $tsIp = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4 2>$null | Select-Object -First 1)
            if ($tsIp) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $tsIp) { throw 'Could not get Tailscale IP' }

          $tsDns = 'n/a'
          try {
            $tsStatus = (& 'C:\Program Files\Tailscale\tailscale.exe' status --self --json) -join "`n"
            $tsDns = (($tsStatus | ConvertFrom-Json).Self.DNSName)
          } catch {}

          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TS_IP=$tsIp`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TS_DNS=$tsDns`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TS_HOST=$tsHostname`n")
          Write-Host "Tailscale connected: $tsIp"

      - name: Send Private Credentials via Telegram Bot
        if: ${{ env.TG_TARGET != '' && env.TELEGRAM_BOT_TOKEN != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Escape-Html([string]$s) {
            return $s.Replace('&', '&amp;').Replace('<', '&lt;').Replace('>', '&gt;')
          }
          function OneLine([string]$s) {
            return (($s -replace "[\r\n]+", ' ').Trim())
          }

          $timeoutMin = [int]$env:TIMEOUT_MINUTES
          if ($timeoutMin -lt 60) { $timeoutMin = 60 }
          if ($timeoutMin -gt 360) { $timeoutMin = 360 }
          $deadline = (Get-Date).ToUniversalTime().AddMinutes($timeoutMin).ToString('yyyy-MM-dd HH:mm') + ' UTC'

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('🖥 <b>AI STV · Máy ảo Windows đã sẵn sàng</b>')
          if ($env:REQ_BY) {
            $lines.Add('👤 Yêu cầu bởi: <b>' + (Escape-Html (OneLine $env:REQ_BY)) + '</b>')
          }
          $lines.Add('')
          $lines.Add('<b>1 · Thông tin kết nối</b>')
          $lines.Add('<pre>' + (@(
              'Máy      : ' + $env:TS_HOST,
              'Tailnet  : ' + $env:TS_DNS,
              'IP       : ' + $env:TS_IP,
              'User     : ' + $env:VM_USER,
              'Password : ' + $env:VM_PASS
            ) -join "`n") + '</pre>')
          $lines.Add('⏱ Hạn dùng: <b>' + $timeoutMin + ' phút</b> (đến ' + $deadline + ')')
          $lines.Add('')
          $lines.Add('<b>2 · Cách vào máy</b>')
          $lines.Add('1) Cài Tailscale cho Windows: https://tailscale.com/download/windows')
          $lines.Add('2) Mở PowerShell và đăng nhập tailnet bằng key của máy này:')
          $lines.Add('<pre>tailscale up --authkey=' + (Escape-Html $env:TAILSCALE_AUTHKEY) + ' --accept-routes</pre>')
          $lines.Add('3) Mở Remote Desktop (mstsc) và kết nối:')
          $lines.Add('<pre>mstsc /v:' + (Escape-Html $env:TS_IP) + '</pre>')
          $lines.Add('4) Đăng nhập bằng <b>User</b> và <b>Password</b> ở mục 1.')
          $lines.Add('')
          $lines.Add('<b>3 · Lưu ý</b>')
          $lines.Add('• Key Tailscale chỉ dùng cho máy này — không chia sẻ ra ngoài.')
          $lines.Add('• Máy tự huỷ sau ' + $timeoutMin + ' phút; dừng sớm: /vm → 🛑 Dừng máy ảo.')
          $text = $lines -join "`n"

          $body = @{
            chat_id = $env:TG_TARGET
            text = $text
            parse_mode = 'HTML'
            disable_web_page_preview = $true
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -ContentType 'application/json; charset=utf-8' -Body $body | Out-Null
          Write-Host 'Đã gửi thông tin kết nối qua Telegram DM (chỉ người yêu cầu xem được).'

      - name: Skip Telegram Notification (secrets missing)
        if: ${{ env.TG_TARGET == '' || env.TELEGRAM_BOT_TOKEN == '' }}
        shell: powershell
        run: |
          Write-Host 'Telegram recipient (telegram_chat_id / TELEGRAM_CHAT_ID) or token is missing.'
          Write-Host 'Login details will NOT be sent. Configure both to receive a private DM.'

      - name: Keep-Alive Integration Test Loop
        shell: powershell
        timeout-minutes: 360
        run: |
          $ErrorActionPreference = 'Stop'
          $timeoutMinutes = [int]$env:TIMEOUT_MINUTES
          if ($timeoutMinutes -lt 60)  { $timeoutMinutes = 60 }
          if ($timeoutMinutes -gt 360) { $timeoutMinutes = 360 }

          Write-Host "Environment ready - run time: $timeoutMinutes minutes"
          Write-Host "RDP over Tailscale: mstsc /v:$env:TS_IP (user: $env:VM_USER)"

          for ($i = 1; $i -le $timeoutMinutes; $i++) {
            Start-Sleep -Seconds 60
            ping -n 1 1.1.1.1 | Out-Null
            if ($i % 15 -eq 0) {
              Write-Host "Heartbeat OK: $i / $timeoutMinutes minutes"
            }
          }
          Write-Host "Run time finished ($timeoutMinutes minutes). Runner will be destroyed."
